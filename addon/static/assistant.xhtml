<?xml version="1.0" encoding="UTF-8"?>
<!-- The library assistant window: an empty shell; the plugin builds the chat into #root. -->
<html xmlns="http://www.w3.org/1999/xhtml">
  <head>
    <meta charset="utf-8"/>
    <title>Library assistant</title>
    <link rel="stylesheet" href="chrome://global/skin/global.css"/>
    <style>
      body { margin: 0; padding: 12px; font: message-box; background: Canvas; color: CanvasText; }
      h1 { font-size: 1.1em; margin: 0 0 4px 0; }
      p.intro { margin: 0 0 8px 0; opacity: 0.75; }
    </style>
  </head>
  <body>
    <h1>Library assistant</h1>
    <p class="intro">Ask about your library or ask for changes. Every change shows a preview and runs only when you click Approve.</p>
    <div id="root"></div>
  </body>
</html>
